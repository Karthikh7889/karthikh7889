<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.5" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed">
        <animate attributeName="stop-color"
          values="#7c3aed;#06b6d4;#10b981;#7c3aed"
          dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#06b6d4">
        <animate attributeName="stop-color"
          values="#06b6d4;#10b981;#7c3aed;#06b6d4"
          dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="500" rx="28"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>

  <!-- Glow -->
  <circle cx="100" cy="80" r="180" fill="#7c3aed" opacity=".12">
    <animate attributeName="cx"
      values="100;180;100" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1100" cy="420" r="200" fill="#06b6d4" opacity=".10">
    <animate attributeName="cy"
      values="420;350;420" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Border -->
  <rect x="2" y="2" width="1196" height="496" rx="28"
        fill="none" stroke="url(#accent)" stroke-width="2"/>

  <!-- Left ASCII -->
  <g font-family="monospace" font-weight="bold"
     font-size="18" fill="url(#accent)" filter="url(#glow)">

    <text x="75" y="100">&lt; / \ &gt;</text>
    <text x="75" y="125"> /|   |\ </text>
    <text x="75" y="150">|  ● ●  |</text>
    <text x="75" y="175">|   ▽   |</text>
    <text x="75" y="200"> \ --- /</text>
    <text x="75" y="225">  \___/</text>
    <text x="75" y="250">   |||</text>
    <text x="75" y="275">  /|||\</text>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 -6;0 0"
      dur="4s"
      repeatCount="indefinite"/>
  </g>

  <text x="70" y="320"
        fill="#64748b"
        font-family="monospace"
        font-size="13">
    ~/github/karthikh7889
  </text>

  <!-- Divider -->
  <line x1="350" y1="55" x2="350" y2="445"
        stroke="#ffffff" stroke-opacity=".1"/>

  <!-- Terminal -->
  <rect x="390" y="45" width="750" height="410"
        rx="20"
        fill="#020617"
        stroke="#ffffff"
        stroke-opacity=".10"/>

  <!-- Terminal header -->
  <circle cx="425" cy="75" r="6" fill="#ef4444"/>
  <circle cx="445" cy="75" r="6" fill="#eab308"/>
  <circle cx="465" cy="75" r="6" fill="#22c55e"/>

  <text x="500" y="80"
        fill="#64748b"
        font-family="monospace"
        font-size="12">
    karthikh7889@github
  </text>

  <!-- Greeting -->
  <text x="430" y="135"
        fill="#f8fafc"
        font-family="sans-serif"
        font-size="28"
        font-weight="700">
    Hi 👋 I'm Karthik
  </text>

  <!-- Animated role -->
  <text x="430" y="175"
        fill="url(#accent)"
        font-family="monospace"
        font-size="18">
    &gt; Full Stack Developer
    <animate attributeName="opacity"
      values="0;1;1;0"
      dur="4s"
      repeatCount="indefinite"/>
  </text>

  <!-- Cursor -->
  <rect x="720" y="160" width="8" height="20"
        fill="#06b6d4">
    <animate attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Information -->
  <g font-family="monospace" font-size="14">

    <text x="430" y="220" fill="#64748b">USERNAME</text>
    <text x="580" y="220" fill="#f8fafc">karthikh7889</text>

    <text x="430" y="250" fill="#64748b">FOCUS</text>
    <text x="580" y="250" fill="#f8fafc">
      Web • AI • Software
    </text>

    <text x="430" y="280" fill="#64748b">STATUS</text>
    <text x="580" y="280" fill="#10b981">
      ● Building &amp; Learning
    </text>

  </g>

  <!-- Skills -->
  <text x="430" y="325"
        fill="#64748b"
        font-family="monospace"
        font-size="12">
    SKILLS
  </text>

  <g font-family="sans-serif" font-size="12" font-weight="600">

    <rect x="430" y="340" width="70" height="28" rx="14"
          fill="#7c3aed" fill-opacity=".18"
          stroke="#7c3aed"/>
    <text x="448" y="358" fill="#c4b5fd">Python</text>

    <rect x="510" y="340" width="65" height="28" rx="14"
          fill="#06b6d4" fill-opacity=".15"
          stroke="#06b6d4"/>
    <text x="527" y="358" fill="#67e8f9">Flask</text>

    <rect x="585" y="340" width="65" height="28" rx="14"
          fill="#10b981" fill-opacity=".15"
          stroke="#10b981"/>
    <text x="603" y="358" fill="#6ee7b7">HTML</text>

    <rect x="660" y="340" width="65" height="28" rx="14"
          fill="#06b6d4" fill-opacity=".15"
          stroke="#06b6d4"/>
    <text x="678" y="358" fill="#67e8f9">CSS</text>

    <rect x="735" y="340" width="60" height="28" rx="14"
          fill="#7c3aed" fill-opacity=".18"
          stroke="#7c3aed"/>
    <text x="754" y="358" fill="#c4b5fd">Git</text>

  </g>

  <!-- Footer -->
  <text x="430" y="410"
        fill="#64748b"
        font-family="monospace"
        font-size="12">
    github.com/karthikh7889
  </text>

  <!-- Scanline -->
  <rect x="20" y="20" width="1160" height="2"
        fill="url(#accent)" opacity=".25"
        clip-path="url(#clip)">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="0 460"
      dur="5s"
      repeatCount="indefinite"/>
  </rect>

</svg>
