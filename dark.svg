<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610">
  <defs>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color"
                 values="#7C3AED;#22D3EE;#10B981;#7C3AED"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color"
                 values="#22D3EE;#10B981;#7C3AED;#22D3EE"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color"
                 values="#10B981;#7C3AED;#22D3EE;#10B981"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <clipPath id="clip">
      <rect width="1180" height="610" rx="28"/>
    </clipPath>

    <mask id="fade">
      <linearGradient id="maskGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="white"/>
        <stop offset="85%" stop-color="white"/>
        <stop offset="100%" stop-color="black"/>
      </linearGradient>
      <rect width="1180" height="610" fill="url(#maskGradient)"/>
    </mask>

  </defs>

  <g clip-path="url(#clip)">

    <!-- Background -->
    <rect width="1180" height="610" fill="#030712"/>

    <!-- Ambient glows -->
    <circle cx="170" cy="100" r="250" fill="url(#glow2)">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;35 20;0 0"
        dur="10s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1000" cy="500" r="300" fill="url(#glow1)">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-30 -25;0 0"
        dur="12s"
        repeatCount="indefinite"/>
    </circle>

    <!-- Floating particles -->
    <g fill="#22D3EE" opacity=".45">
      <circle cx="90" cy="120" r="2">
        <animate attributeName="cy" values="120;90;120" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="310" cy="510" r="1.5">
        <animate attributeName="cy" values="510;480;510" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1080" cy="130" r="2">
        <animate attributeName="cy" values="130;160;130" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="80" r="1.5">
        <animate attributeName="cy" values="80;55;80" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Main glass panel -->
    <rect x="25" y="25" width="1130" height="560" rx="26"
          fill="#0F172A" fill-opacity=".78"
          stroke="white" stroke-opacity=".08"/>

    <!-- Animated border -->
    <rect x="25" y="25" width="1130" height="560" rx="26"
          fill="none"
          stroke="url(#accent)"
          stroke-width="1"
          stroke-dasharray="80 1000"
          opacity=".65">
      <animate attributeName="stroke-dashoffset"
               values="0;-1080"
               dur="7s"
               repeatCount="indefinite"/>
    </rect>

    <!-- Divider -->
    <line x1="455" y1="70" x2="455" y2="540"
          stroke="white" stroke-opacity=".07"/>

    <!-- ================= LEFT ASCII ================= -->

    <text x="70" y="78"
          fill="#94A3B8"
          font-family="monospace"
          font-size="12"
          letter-spacing="2">
      SYSTEM / PROFILE
    </text>

    <g font-family="monospace"
       font-size="15"
       font-weight="bold"
       fill="url(#accent)"
       opacity=".95">

      <text x="70" y="130">
        <tspan x="70" dy="0">          .--------.</tspan>
        <tspan x="70" dy="18">       .-'          '-.</tspan>
        <tspan x="70" dy="18">      /    .------.    \</tspan>
        <tspan x="70" dy="18">     /    /  ◉  ◉  \    \</tspan>
        <tspan x="70" dy="18">    |    |     &gt;     |    |</tspan>
        <tspan x="70" dy="18">    |    |  .----.  |    |</tspan>
        <tspan x="70" dy="18">     \    \ '----' /    /</tspan>
        <tspan x="70" dy="18">      \    '------'    /</tspan>
        <tspan x="70" dy="18">       '-.          .-'</tspan>
        <tspan x="70" dy="18">          '--------'</tspan>
        <tspan x="70" dy="18">             /||\</tspan>
        <tspan x="70" dy="18">            /_||_\</tspan>
        <tspan x="70" dy="18">           /  ||  \</tspan>
        <tspan x="70" dy="18">          /___||___\</tspan>
      </text>

      <!-- Reveal animation -->
      <animate attributeName="opacity"
               values="0;0;1"
               keyTimes="0;.15;1"
               dur="3s"
               fill="freeze"/>
    </g>

    <!-- Scanline -->
    <rect x="65" y="90" width="340" height="3"
          fill="#22D3EE"
          opacity=".25"
          filter="url(#glow)">
      <animate attributeName="y"
               values="90;420;90"
               dur="5s"
               repeatCount="indefinite"/>
    </rect>

    <!-- Terminal prompt -->
    <text x="70" y="475"
          fill="#94A3B8"
          font-family="monospace"
          font-size="13">
      <tspan fill="#10B981">karthik</tspan>
      <tspan fill="#64748B">@</tspan>
      <tspan fill="#22D3EE">github</tspan>
      <tspan fill="#64748B">:</tspan>
      <tspan fill="#F8FAFC">~$ whoami</tspan>
    </text>

    <text x="70" y="500"
          fill="#F8FAFC"
          font-family="monospace"
          font-size="13">
      Karthik
      <animate attributeName="opacity"
               values="0;0;1"
               keyTimes="0;.5;1"
               dur="3s"
               fill="freeze"/>
    </text>

    <!-- Cursor -->
    <rect x="125" y="488" width="7" height="16" fill="#22D3EE">
      <animate attributeName="opacity"
               values="1;0;1"
               dur="1s"
               repeatCount="indefinite"/>
    </rect>

    <!-- ================= RIGHT TERMINAL ================= -->

    <!-- Terminal window -->
    <rect x="490" y="60" width="620" height="450"
          rx="18"
          fill="#020617"
          fill-opacity=".72"
          stroke="white"
          stroke-opacity=".08"/>

    <!-- Terminal header -->
    <rect x="490" y="60" width="620" height="48"
          rx="18"
          fill="#111827"/>

    <circle cx="518" cy="84" r="6" fill="#EF4444" opacity=".8"/>
    <circle cx="540" cy="84" r="6" fill="#F59E0B" opacity=".8"/>
    <circle cx="562" cy="84" r="6" fill="#10B981" opacity=".8"/>

    <text x="780" y="89"
          text-anchor="middle"
          fill="#64748B"
          font-family="monospace"
          font-size="12">
      profile.sh
    </text>

    <!-- Greeting -->
    <text x="525" y="145"
          fill="#94A3B8"
          font-family="monospace"
          font-size="13">
      $ echo "Hi 👋"
    </text>

    <text x="525" y="180"
          fill="#F8FAFC"
          font-family="sans-serif"
          font-size="31"
          font-weight="700">
      I'm Karthik
    </text>

    <!-- Animated role -->
    <text x="525" y="215"
          fill="url(#accent)"
          font-family="monospace"
          font-size="16"
          font-weight="600">
      &gt; Full Stack Developer
      <animate attributeName="opacity"
               values="0;1;1;0"
               keyTimes="0;.15;.85;1"
               dur="5s"
               repeatCount="indefinite"/>
    </text>

    <text x="525" y="215"
          fill="url(#accent)"
          font-family="monospace"
          font-size="16"
          font-weight="600"
          opacity="0">
      &gt; AI Enthusiast
      <animate attributeName="opacity"
               values="0;0;1;1;0"
               keyTimes="0;.2;.35;.75;1"
               dur="5s"
               repeatCount="indefinite"/>
    </text>

    <!-- Info -->
    <g font-family="sans-serif" font-size="14">

      <text x="525" y="265" fill="#94A3B8">📍 Location</text>
      <text x="700" y="265" fill="#F8FAFC">Karnataka, India</text>

      <text x="525" y="300" fill="#94A3B8">🎓 Education</text>
      <text x="700" y="300" fill="#F8FAFC">Computer Science Student</text>

      <text x="525" y="335" fill="#94A3B8">⚡ Focus</text>
      <text x="700" y="335" fill="#F8FAFC">Web • AI • Software</text>

      <text x="525" y="370" fill="#94A3B8">🌐 Portfolio</text>
      <text x="700" y="370" fill="#22D3EE">github.com/karthikh7889</text>

    </g>

    <!-- Sequential reveal -->
    <g>
      <animate attributeName="opacity"
               values="0;1"
               dur="2s"
               begin="1s"
               fill="freeze"/>
    </g>

    <!-- Skills -->
    <text x="525" y="410"
          fill="#94A3B8"
          font-family="monospace"
          font-size="12"
          letter-spacing="1">
      STACK
    </text>

    <g font-family="sans-serif" font-size="11">

      <g transform="translate(525 425)">
        <rect width="70" height="27" rx="13"
              fill="#7C3AED" fill-opacity=".13"
              stroke="#7C3AED" stroke-opacity=".35"/>
        <text x="35" y="18" text-anchor="middle" fill="#C4B5FD">Python</text>
      </g>

      <g transform="translate(603 425)">
        <rect width="70" height="27" rx="13"
              fill="#22D3EE" fill-opacity=".12"
              stroke="#22D3EE" stroke-opacity=".35"/>
        <text x="35" y="18" text-anchor="middle" fill="#67E8F9">Flask</text>
      </g>

      <g transform="translate(681 425)">
        <rect width="70" height="27" rx="13"
              fill="#10B981" fill-opacity=".12"
              stroke="#10B981" stroke-opacity=".35"/>
        <text x="35" y="18" text-anchor="middle" fill="#6EE7B7">Git</text>
      </g>

      <g transform="translate(759 425)">
        <rect width="80" height="27" rx="13"
              fill="#22D3EE" fill-opacity=".12"
              stroke="#22D3EE" stroke-opacity=".35"/>
        <text x="40" y="18" text-anchor="middle" fill="#67E8F9">JavaScript</text>
      </g>

      <g transform="translate(847 425)">
        <rect width="75" height="27" rx="13"
              fill="#7C3AED" fill-opacity=".13"
              stroke="#7C3AED" stroke-opacity=".35"/>
        <text x="37" y="18" text-anchor="middle" fill="#C4B5FD">HTML/CSS</text>
      </g>

      <g transform="translate(930 425)">
        <rect width="70" height="27" rx="13"
              fill="#10B981" fill-opacity=".12"
              stroke="#10B981" stroke-opacity=".35"/>
        <text x="35" y="18" text-anchor="middle" fill="#6EE7B7">SQL</text>
      </g>

    </g>

    <!-- Bottom social line -->
    <line x1="525" y1="480" x2="1075" y2="480"
          stroke="white" stroke-opacity=".06"/>

    <text x="525" y="500"
          fill="#64748B"
          font-family="monospace"
          font-size="11">
      GitHub  •  LinkedIn  •  Projects  •  Open Source
    </text>

    <!-- Moving reflection -->
    <rect x="470" y="40" width="80" height="520"
          fill="white"
          opacity=".025"
          transform="skewX(-15)">
      <animate attributeName="x"
               values="450;1150;450"
               dur="8s"
               repeatCount="indefinite"/>
    </rect>

    <!-- Bottom status -->
    <circle cx="1035" cy="550" r="4" fill="#10B981">
      <animate attributeName="opacity"
               values=".3;1;.3"
               dur="1.8s"
               repeatCount="indefinite"/>
    </circle>

    <text x="1050" y="554"
          fill="#64748B"
          font-family="monospace"
          font-size="10">
      ONLINE
    </text>

  </g>
</svg>
