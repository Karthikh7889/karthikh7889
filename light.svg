<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610">
  <defs>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color"
                 values="#2563EB;#06B6D4;#10B981;#2563EB"
                 dur="8s" repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#06B6D4">
        <animate attributeName="stop-color"
                 values="#06B6D4;#10B981;#2563EB;#06B6D4"
                 dur="8s" repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color"
                 values="#10B981;#2563EB;#06B6D4;#10B981"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <clipPath id="clip">
      <rect width="1180" height="610" rx="28"/>
    </clipPath>

  </defs>

  <g clip-path="url(#clip)">

    <!-- Background -->
    <rect width="1180" height="610" fill="#FFFFFF"/>

    <!-- Soft background glow -->
    <circle cx="150" cy="100" r="260" fill="url(#blueGlow)">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;30 20;0 0"
        dur="10s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1030" cy="500" r="300" fill="url(#cyanGlow)">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-25 -20;0 0"
        dur="12s"
        repeatCount="indefinite"/>
    </circle>

    <!-- Floating particles -->
    <g fill="#06B6D4" opacity=".35">

      <circle cx="90" cy="120" r="2">
        <animate attributeName="cy"
                 values="120;90;120"
                 dur="5s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="310" cy="510" r="1.5">
        <animate attributeName="cy"
                 values="510;480;510"
                 dur="6s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="1080" cy="130" r="2">
        <animate attributeName="cy"
                 values="130;160;130"
                 dur="7s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="900" cy="80" r="1.5">
        <animate attributeName="cy"
                 values="80;55;80"
                 dur="4s"
                 repeatCount="indefinite"/>
      </circle>

    </g>

    <!-- Main panel -->
    <rect x="25" y="25"
          width="1130"
          height="560"
          rx="26"
          fill="#F8FAFC"
          fill-opacity=".94"
          stroke="#0F172A"
          stroke-opacity=".08"/>

    <!-- Animated border -->
    <rect x="25" y="25"
          width="1130"
          height="560"
          rx="26"
          fill="none"
          stroke="url(#accent)"
          stroke-width="1"
          stroke-dasharray="80 1000"
          opacity=".65">

      <animate attributeName="stroke-dashoffset"
               values="0;-1080"
               dur="7s"
               repeatCount="indefinite"/>

    </rect>

    <!-- Divider -->
    <line x1="455"
          y1="70"
          x2="455"
          y2="540"
          stroke="#0F172A"
          stroke-opacity=".08"/>

    <!-- LEFT SIDE -->

    <text x="70"
          y="78"
          fill="#475569"
          font-family="monospace"
          font-size="12"
          letter-spacing="2">
      SYSTEM / PROFILE
    </text>

    <!-- ASCII portrait -->
    <g font-family="monospace"
       font-size="15"
       font-weight="bold"
       fill="url(#accent)"
       opacity=".95">

      <text x="70" y="130">

        <tspan x="70" dy="0">          .--------.</tspan>
        <tspan x="70" dy="18">       .-'          '-.</tspan>
        <tspan x="70" dy="18">      /    .------.    \</tspan>
        <tspan x="70" dy="18">     /    /  ◉  ◉  \    \</tspan>
        <tspan x="70" dy="18">    |    |     &gt;     |    |</tspan>
        <tspan x="70" dy="18">    |    |  .----.  |    |</tspan>
        <tspan x="70" dy="18">     \    \ '----' /    /</tspan>
        <tspan x="70" dy="18">      \    '------'    /</tspan>
        <tspan x="70" dy="18">       '-.          .-'</tspan>
        <tspan x="70" dy="18">          '--------'</tspan>
        <tspan x="70" dy="18">             /||\</tspan>
        <tspan x="70" dy="18">            /_||_\</tspan>
        <tspan x="70" dy="18">           /  ||  \</tspan>
        <tspan x="70" dy="18">          /___||___\</tspan>

      </text>

      <animate attributeName="opacity"
               values="0;0;1"
               keyTimes="0;.15;1"
               dur="3s"
               fill="freeze"/>

    </g>

    <!-- Scanline -->
    <rect x="65"
          y="90"
          width="340"
          height="3"
          fill="#06B6D4"
          opacity=".18"
          filter="url(#glow)">

      <animate attributeName="y"
               values="90;420;90"
               dur="5s"
               repeatCount="indefinite"/>

    </rect>

    <!-- Terminal prompt -->
    <text x="70"
          y="475"
          fill="#475569"
          font-family="monospace"
          font-size="13">

      <tspan fill="#059669">karthik</tspan>
      <tspan fill="#64748B">@</tspan>
      <tspan fill="#0284C7">github</tspan>
      <tspan fill="#64748B">:</tspan>
      <tspan fill="#0F172A">~$ whoami</tspan>

    </text>

    <text x="70"
          y="500"
          fill="#0F172A"
          font-family="monospace"
          font-size="13">

      Karthik

      <animate attributeName="opacity"
               values="0;0;1"
               keyTimes="0;.5;1"
               dur="3s"
               fill="freeze"/>

    </text>

    <!-- Cursor -->
    <rect x="125"
          y="488"
          width="7"
          height="16"
          fill="#06B6D4">

      <animate attributeName="opacity"
               values="1;0;1"
               dur="1s"
               repeatCount="indefinite"/>

    </rect>

    <!-- RIGHT TERMINAL -->

    <rect x="490"
          y="60"
          width="620"
          height="450"
          rx="18"
          fill="#FFFFFF"
          fill-opacity=".82"
          stroke="#0F172A"
          stroke-opacity=".08"/>

    <!-- Terminal header -->
    <rect x="490"
          y="60"
          width="620"
          height="48"
          rx="18"
          fill="#F1F5F9"/>

    <circle cx="518" cy="84" r="6"
            fill="#EF4444"
            opacity=".65"/>

    <circle cx="540" cy="84" r="6"
            fill="#F59E0B"
            opacity=".65"/>

    <circle cx="562" cy="84" r="6"
            fill="#10B981"
            opacity=".65"/>

    <text x="780"
          y="89"
          text-anchor="middle"
          fill="#64748B"
          font-family="monospace"
          font-size="12">
      profile.sh
    </text>

    <!-- Greeting -->
    <text x="525"
          y="145"
          fill="#475569"
          font-family="monospace"
          font-size="13">
      $ echo "Hi 👋"
    </text>

    <text x="525"
          y="180"
          fill="#0F172A"
          font-family="sans-serif"
          font-size="31"
          font-weight="700">
      I'm Karthik
    </text>

    <!-- Roles -->
    <text x="525"
          y="215"
          fill="url(#accent)"
          font-family="monospace"
          font-size="16"
          font-weight="600">

      &gt; Full Stack Developer

      <animate attributeName="opacity"
               values="0;1;1;0"
               keyTimes="0;.15;.85;1"
               dur="5s"
               repeatCount="indefinite"/>

    </text>

    <text x="525"
          y="215"
          fill="url(#accent)"
          font-family="monospace"
          font-size="16"
          font-weight="600"
          opacity="0">

      &gt; AI Enthusiast

      <animate attributeName="opacity"
               values="0;0;1;1;0"
               keyTimes="0;.2;.35;.75;1"
               dur="5s"
               repeatCount="indefinite"/>

    </text>

    <!-- Information -->
    <g font-family="sans-serif"
       font-size="14">

      <text x="525" y="265"
            fill="#475569">
        📍 Location
      </text>

      <text x="700" y="265"
            fill="#0F172A">
        Karnataka, India
      </text>

      <text x="525" y="300"
            fill="#475569">
        🎓 Education
      </text>

      <text x="700" y="300"
            fill="#0F172A">
        Computer Science Student
      </text>

      <text x="525" y="335"
            fill="#475569">
        ⚡ Focus
      </text>

      <text x="700" y="335"
            fill="#0F172A">
        Web • AI • Software
      </text>

      <text x="525" y="370"
            fill="#475569">
        🌐 Portfolio
      </text>

      <text x="700" y="370"
            fill="#0284C7">
        github.com/karthikh7889
      </text>

    </g>

    <!-- Skills -->
    <text x="525"
          y="410"
          fill="#475569"
          font-family="monospace"
          font-size="12"
          letter-spacing="1">
      STACK
    </text>

    <g font-family="sans-serif"
       font-size="11">

      <g transform="translate(525 425)">
        <rect width="70"
              height="27"
              rx="13"
              fill="#2563EB"
              fill-opacity=".08"
              stroke="#2563EB"
              stroke-opacity=".28"/>
        <text x="35"
              y="18"
              text-anchor="middle"
              fill="#2563EB">
          Python
        </text>
      </g>

      <g transform="translate(603 425)">
        <rect width="70"
              height="27"
              rx="13"
              fill="#06B6D4"
              fill-opacity=".08"
              stroke="#06B6D4"
              stroke-opacity=".28"/>
        <text x="35"
              y="18"
              text-anchor="middle"
              fill="#0891B2">
          Flask
        </text>
      </g>

      <g transform="translate(681 425)">
        <rect width="70"
              height="27"
              rx="13"
              fill="#10B981"
              fill-opacity=".08"
              stroke="#10B981"
              stroke-opacity=".28"/>
        <text x="35"
              y="18"
              text-anchor="middle"
              fill="#059669">
          Git
        </text>
      </g>

      <g transform="translate(759 425)">
        <rect width="80"
              height="27"
              rx="13"
              fill="#06B6D4"
              fill-opacity=".08"
              stroke="#06B6D4"
              stroke-opacity=".28"/>
        <text x="40"
              y="18"
              text-anchor="middle"
              fill="#0891B2">
          JavaScript
        </text>
      </g>

      <g transform="translate(847 425)">
        <rect width="75"
              height="27"
              rx="13"
              fill="#2563EB"
              fill-opacity=".08"
              stroke="#2563EB"
              stroke-opacity=".28"/>
        <text x="37"
              y="18"
              text-anchor="middle"
              fill="#2563EB">
          HTML/CSS
        </text>
      </g>

      <g transform="translate(930 425)">
        <rect width="70"
              height="27"
              rx="13"
              fill="#10B981"
              fill-opacity=".08"
              stroke="#10B981"
              stroke-opacity=".28"/>
        <text x="35"
              y="18"
              text-anchor="middle"
              fill="#059669">
          SQL
        </text>
      </g>

    </g>

    <!-- Bottom -->
    <line x1="525"
          y1="480"
          x2="1075"
          y2="480"
          stroke="#0F172A"
          stroke-opacity=".07"/>

    <text x="525"
          y="500"
          fill="#64748B"
          font-family="monospace"
          font-size="11">
      GitHub  •  LinkedIn  •  Projects  •  Open Source
    </text>

    <!-- Reflection -->
    <rect x="470"
          y="40"
          width="80"
          height="520"
          fill="#FFFFFF"
          opacity=".25"
          transform="skewX(-15)">

      <animate attributeName="x"
               values="450;1150;450"
               dur="8s"
               repeatCount="indefinite"/>

    </rect>

    <!-- Online indicator -->
    <circle cx="1035"
            cy="550"
            r="4"
            fill="#10B981">

      <animate attributeName="opacity"
               values=".3;1;.3"
               dur="1.8s"
               repeatCount="indefinite"/>

    </circle>

    <text x="1050"
          y="554"
          fill="#64748B"
          font-family="monospace"
          font-size="10">
      ONLINE
    </text>

  </g>
</svg>
