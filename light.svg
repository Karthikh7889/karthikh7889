<svg xmlns="http://www.w3.org/2000/svg"
     width="1180"
     height="610"
     viewBox="0 0 1180 610">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF6FF"/>
      <animateTransform
        attributeName="gradientTransform"
        type="rotate"
        from="0 0.5 0.5"
        to="360 0.5 0.5"
        dur="25s"
        repeatCount="indefinite"/>
    </linearGradient>

    <!-- Accent -->
    <linearGradient id="accent"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color"
                 values="#2563EB;#06B6D4;#10B981;#2563EB"
                 dur="8s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#06B6D4">
        <animate attributeName="stop-color"
                 values="#06B6D4;#10B981;#2563EB;#06B6D4"
                 dur="8s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color"
                 values="#10B981;#2563EB;#06B6D4;#10B981"
                 dur="8s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Blue glow -->
    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan glow -->
    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass -->
    <linearGradient id="glass"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity=".72"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow"
            x="-30%" y="-30%"
            width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="15"
        stdDeviation="22"
        flood-color="#0F172A"
        flood-opacity=".12"/>
    </filter>

    <!-- Glow -->
    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="5"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip -->
    <clipPath id="cardClip">
      <rect x="25" y="25"
            width="1130"
            height="560"
            rx="32"/>
    </clipPath>

    <!-- Scanline -->
    <linearGradient id="scan"
                    x1="0" y1="0"
                    x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1180"
        height="610"
        rx="32"
        fill="url(#bg)"/>

  <circle cx="130" cy="120"
          r="230"
          fill="url(#blueGlow)">
    <animate attributeName="r"
             values="210;250;210"
             dur="7s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1050" cy="500"
          r="250"
          fill="url(#cyanGlow)">
    <animate attributeName="r"
             values="230;270;230"
             dur="9s"
             repeatCount="indefinite"/>
  </circle>


  <!-- ================================================= -->
  <!-- MAIN GLASS CARD -->
  <!-- ================================================= -->

  <rect x="25"
        y="25"
        width="1130"
        height="560"
        rx="32"
        fill="url(#glass)"
        stroke="#0F172A"
        stroke-opacity=".08"
        filter="url(#shadow)"/>


  <!-- ================================================= -->
  <!-- BORDER SHIMMER -->
  <!-- ================================================= -->

  <rect x="26"
        y="26"
        width="1128"
        height="558"
        rx="31"
        fill="none"
        stroke="url(#accent)"
        stroke-width="2"
        stroke-dasharray="120 900"
        opacity=".65">

    <animate attributeName="stroke-dashoffset"
             from="0"
             to="-1020"
             dur="7s"
             repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- LEFT SECTION -->
  <!-- ================================================= -->

  <g clip-path="url(#cardClip)">

    <!-- left divider -->
    <line x1="455"
          y1="70"
          x2="455"
          y2="540"
          stroke="#0F172A"
          stroke-opacity=".07"/>


    <!-- floating glow -->
    <circle cx="220"
            cy="300"
            r="175"
            fill="url(#cyanGlow)"
            opacity=".5">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 0 -12; 0 0"
        dur="6s"
        repeatCount="indefinite"/>
    </circle>


    <!-- ================================================= -->
    <!-- ASCII PORTRAIT -->
    <!-- ================================================= -->

    <g font-family="monospace"
       font-size="18"
       font-weight="700"
       fill="url(#accent)"
       filter="url(#glow)">

      <text x="70" y="130"
            opacity="0">
        &lt;/&gt;
        <animate attributeName="opacity"
                 values="0;1"
                 begin=".2s"
                 dur=".5s"
                 fill="freeze"/>
      </text>

      <text x="70" y="155"
            opacity="0">
        ██████╗  ██████╗
        <animate attributeName="opacity"
                 values="0;1"
                 begin=".6s"
                 dur=".5s"
                 fill="freeze"/>
      </text>

      <text x="70" y="180"
            opacity="0">
        ██╔══██╗██╔════╝
        <animate attributeName="opacity"
                 values="0;1"
                 begin="1s"
                 dur=".5s"
                 fill="freeze"/>
      </text>

      <text x="70" y="205"
            opacity="0">
        ██║  ██║██║
        <animate attributeName="opacity"
                 values="0;1"
                 begin="1.4s"
                 dur=".5s"
                 fill="freeze"/>
      </text>

      <text x="70" y="230"
            opacity="0">
        ██║  ██║██║
        <animate attributeName="opacity"
                 values="0;1"
                 begin="1.8s"
                 dur=".5s"
                 fill="freeze"/>
      </text>

      <text x="70" y="255"
            opacity="0">
        ╚█████╔╝╚██████╗
        <animate attributeName="opacity"
                 values="0;1"
                 begin="2.2s"
                 dur=".5s"
                 fill="freeze"/>
      </text>

      <text x="70" y="280"
            opacity="0">
        ╚════╝  ╚═════╝
        <animate attributeName="opacity"
                 values="0;1"
                 begin="2.6s"
                 dur=".5s"
                 fill="freeze"/>
      </text>

    </g>


    <!-- floating ASCII effect -->

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 -6;0 0"
      dur="5s"
      repeatCount="indefinite"/>


    <!-- terminal label -->

    <text x="70"
          y="335"
          font-family="monospace"
          font-size="13"
          fill="#475569">

      &gt; initializing_profile...

      <animate attributeName="opacity"
               values=".4;1;.4"
               dur="3s"
               repeatCount="indefinite"/>

    </text>


    <!-- terminal cursor -->

    <rect x="245"
          y="322"
          width="7"
          height="16"
          rx="2"
          fill="#06B6D4">

      <animate attributeName="opacity"
               values="1;0;1"
               dur=".9s"
               repeatCount="indefinite"/>

    </rect>


    <!-- scanline -->

    <rect x="55"
          y="80"
          width="350"
          height="3"
          fill="url(#scan)"
          opacity=".7">

      <animate attributeName="y"
               values="80;370;80"
               dur="5s"
               repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- ================================================= -->
  <!-- RIGHT TERMINAL -->
  <!-- ================================================= -->

  <g>

    <!-- terminal window -->

    <rect x="490"
          y="70"
          width="610"
          height="390"
          rx="22"
          fill="#F8FAFC"
          fill-opacity=".92"
          stroke="#0F172A"
          stroke-opacity=".08"/>


    <!-- terminal header -->

    <line x1="490"
          y1="118"
          x2="1100"
          y2="118"
          stroke="#0F172A"
          stroke-opacity=".08"/>


    <!-- traffic lights -->

    <circle cx="520"
            cy="94"
            r="6"
            fill="#EF4444"/>

    <circle cx="542"
            cy="94"
            r="6"
            fill="#F59E0B"/>

    <circle cx="564"
            cy="94"
            r="6"
            fill="#10B981"/>


    <text x="610"
          y="100"
          font-family="monospace"
          font-size="12"
          fill="#64748B">
      karthik@github ~ profile
    </text>


    <!-- greeting -->

    <text x="525"
          y="155"
          font-family="monospace"
          font-size="15"
          fill="#64748B">

      Hi 👋

      <animate attributeName="opacity"
               values="0;1"
               begin="3s"
               dur=".7s"
               fill="freeze"/>

    </text>


    <!-- name -->

    <text x="525"
          y="190"
          font-family="sans-serif"
          font-size="30"
          font-weight="700"
          fill="url(#accent)">

      I'm Karthik

      <animate attributeName="opacity"
               values="0;1"
               begin="3.5s"
               dur=".7s"
               fill="freeze"/>

    </text>


    <!-- typing role -->

    <text x="525"
          y="220"
          font-family="monospace"
          font-size="14"
          fill="#475569">

      AI &amp; Data Science Student

      <animate attributeName="opacity"
               values="0;1"
               begin="4s"
               dur=".7s"
               fill="freeze"/>

    </text>


    <!-- profile information -->

    <g font-family="sans-serif"
       font-size="13"
       fill="#475569">

      <text x="525" y="260">
        📍 India
        <animate attributeName="opacity"
                 values="0;1"
                 begin="4.4s"
                 dur=".5s"
                 fill="freeze"/>
      </text>

      <text x="525" y="285">
        🎓 Artificial Intelligence &amp; Data Science
        <animate attributeName="opacity"
                 values="0;1"
                 begin="4.8s"
                 dur=".5s"
                 fill="freeze"/>
      </text>

      <text x="525" y="310">
        ⚡ Current Focus: Python • AI • Data
        <animate attributeName="opacity"
                 values="0;1"
                 begin="5.2s"
                 dur=".5s"
                 fill="freeze"/>
      </text>

      <text x="525" y="335">
        💻 Building &amp; learning every day
        <animate attributeName="opacity"
                 values="0;1"
                 begin="5.6s"
                 dur=".5s"
                 fill="freeze"/>
      </text>

    </g>


    <!-- ================================================= -->
    <!-- SKILLS -->
    <!-- ================================================= -->

    <g font-family="sans-serif"
       font-size="12"
       font-weight="600">

      <!-- Python -->

      <rect x="525" y="365"
            width="75"
            height="28"
            rx="14"
            fill="#EFF6FF"
            stroke="#2563EB"
            stroke-opacity=".25"/>

      <text x="543" y="383"
            fill="#2563EB">
        Python
      </text>


      <!-- AI -->

      <rect x="610" y="365"
            width="55"
            height="28"
            rx="14"
            fill="#ECFEFF"
            stroke="#06B6D4"
            stroke-opacity=".25"/>

      <text x="629" y="383"
            fill="#0891B2">
        AI
      </text>


      <!-- Data -->

      <rect x="675" y="365"
            width="65"
            height="28"
            rx="14"
            fill="#ECFDF5"
            stroke="#10B981"
            stroke-opacity=".25"/>

      <text x="691" y="383"
            fill="#059669">
        Data
      </text>


      <!-- Git -->

      <rect x="750" y="365"
            width="55"
            height="28"
            rx="14"
            fill="#F8FAFC"
            stroke="#64748B"
            stroke-opacity=".25"/>

      <text x="769" y="383"
            fill="#475569">
        Git
      </text>


      <!-- SQL -->

      <rect x="815" y="365"
            width="60"
            height="28"
            rx="14"
            fill="#EFF6FF"
            stroke="#2563EB"
            stroke-opacity=".25"/>

      <text x="833" y="383"
            fill="#2563EB">
        SQL
      </text>


      <!-- Linux -->

      <rect x="885" y="365"
            width="70"
            height="28"
            rx="14"
            fill="#ECFEFF"
            stroke="#06B6D4"
            stroke-opacity=".25"/>

      <text x="902" y="383"
            fill="#0891B2">
        Linux
      </text>

    </g>

  </g>


  <!-- ================================================= -->
  <!-- SOCIAL LINKS -->
  <!-- ================================================= -->

  <g font-family="sans-serif"
     font-size="13"
     fill="#475569">

    <text x="500" y="515">
      GitHub
    </text>

    <text x="590" y="515">
      LinkedIn
    </text>

    <text x="700" y="515">
      Portfolio
    </text>

    <text x="820" y="515">
      Python • AI • Data
    </text>

  </g>


  <!-- ================================================= -->
  <!-- BOTTOM GLOW -->
  <!-- ================================================= -->

  <rect x="70"
        y="548"
        width="1040"
        height="2"
        rx="1"
        fill="url(#accent)"
        opacity=".45">

    <animate attributeName="opacity"
             values=".25;.8;.25"
             dur="3s"
             repeatCount="indefinite"/>

  </rect>

</svg>
